name: Build and sample correctness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sample-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the required system library
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build with the provided Makefile
        run: make
        working-directory: src
      - name: Run the supplied correctness test
        run: make test
        working-directory: src
